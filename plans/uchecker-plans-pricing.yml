api_access:
  gated_by_plan: false
  note: >-
    The REST API, the hosted MCP server, the web dashboard and the Telegram bot all draw on
    the same credit balance. There is no API-only tier, no per-seat charge, and no separate
    MCP price list — uChecker's MCP page states plainly that "Pricing matches the API".
enterprise:
  contact_sales: false
  note: >-
    No "contact us" enterprise tier is advertised on the public pricing table; the largest
    published pack is 1,000,000 addresses. An ESP partner programme exists
    (POST /api/v1/esp/price and /api/v1/esp/provision) which prices and provisions
    downstream accounts programmatically, but its rates are not published — they are
    computed per ESP token by the price endpoint.
caveats:
  - >-
    All prices are in Russian roubles only. No USD/EUR list price is published, and the
    accepted payment methods shown on the pricing block are Russian rails.
  - >-
    Credit expiry is not stated anywhere in the pricing block or the terms of service.
