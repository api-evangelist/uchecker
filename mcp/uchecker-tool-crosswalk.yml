      POST /api/v1/validate/bulk. Inherits BulkValidationDto — emails[] (required),
      client_type, webhook_url, websocket_id, idempotency_key. The provider's MCP page caps
      a call at 10,000 addresses; the REST endpoint itself accepts far larger jobs (the
      marketing surface quotes up to 9 million per task), so the 10k ceiling is an
      MCP-layer constraint rather than an API one.
